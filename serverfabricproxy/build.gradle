plugins {
    id "java"
    id "com.gradleup.shadow" version "8.3.0"
}

group = "dev.jumpwatch.serverfabric"
version = "0.1.0"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url "https://repo.spongepowered.org/maven" }
    maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
}

dependencies {
    implementation platform("com.fasterxml.jackson:jackson-bom:2.17.2")
    implementation "com.fasterxml.jackson.core:jackson-databind"
    implementation project(":serverfabricapi")
    compileOnly "net.md-5:bungeecord-api:1.20-R0.1-SNAPSHOT"
}

tasks.shadowJar {
    archiveFileName = "ServerFabricProxy.jar"

    // strongly recommended to avoid library conflicts
    relocate "com.fasterxml.jackson", "dev.jumpwatch.serverfabric.proxy.libs.jackson"
}

tasks.build {
    dependsOn tasks.shadowJar
}